[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "samantha-screen-mirror"
version = "0.6.3"
description = "Mirra: your Windows PC on your phone and your Android phone on your PC, privately over Tailscale. No cloud."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "flask>=3.0",
  "mss>=9.0",
  "pillow>=10.0",
  "python-dotenv>=1.0",
  "waitress>=3.0",
  "qrcode>=7.4",
  "numpy>=1.26",
  "dxcam>=0.3; sys_platform == 'win32'",
  "pyaudiowpatch>=0.2.12; sys_platform == 'win32'",
  "opencv-python-headless>=4.8",
  "customtkinter==5.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
samantha-mirror = "samantha_mirror.cli:main"

[project.gui-scripts]
mirra = "samantha_mirror.desktop:main"

[tool.setuptools]
packages = ["samantha_mirror"]

[tool.setuptools.package-data]
samantha_mirror = ["web/*", "web/assets/*", "phone_app/*.apk", "assets/*"]

[tool.ruff]
line-length = 120
extend-exclude = ["packaging"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B904"]  # long user-facing messages; we re-raise with friendlier text

[tool.pytest.ini_options]
testpaths = ["tests"]
