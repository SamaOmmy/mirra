name: Release

# Push a tag like v0.3.0 to build the Windows download and attach it to a GitHub release.
#
# The Android app must be signed with the same key every time, or phones cannot update it in place. That key comes
# from the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets. Without them a tag build publishes nothing
# (a release can then be built and uploaded by hand with the key, see CONTRIBUTING.md); a manual run still builds a
# test zip signed with a throwaway key.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # manual run: builds the zip and keeps it as a downloadable artifact, no release

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Signing key for the Android app
        id: key
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if ($env:KEYSTORE_B64) { "build=true" >> $env:GITHUB_OUTPUT; exit 0 }
          if ("${{ github.ref_type }}" -eq "tag") {
            "build=false" >> $env:GITHUB_OUTPUT
            Write-Output "::notice::No ANDROID_KEYSTORE_BASE64 secret, so this release is not built here: an app signed with a throwaway key could never update phones in place. Add the secrets, or build and upload the release by hand with the key."
          } else {
            "build=true" >> $env:GITHUB_OUTPUT
            Write-Output "::warning::No ANDROID_KEYSTORE_BASE64 secret: this test build signs the Android app with a throwaway key."
          }
      - uses: actions/checkout@v4
        if: steps.key.outputs.build == 'true'
      - uses: actions/setup-python@v5
        if: steps.key.outputs.build == 'true'
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pyinstaller
        if: steps.key.outputs.build == 'true'
      - name: Tag matches the version in the code
        if: steps.key.outputs.build == 'true' && startsWith(github.ref, 'refs/tags/')
        run: python -c "import samantha_mirror, sys; sys.exit(0 if 'v' + samantha_mirror.__version__ == '${{ github.ref_name }}' else 'tag ${{ github.ref_name }} != version ' + samantha_mirror.__version__)"
      - uses: actions/setup-java@v4
        if: steps.key.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the Android app (it ships inside the zip)
        if: steps.key.outputs.build == 'true'
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SM_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if ($env:KEYSTORE_B64) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/release.keystore", [Convert]::FromBase64String($env:KEYSTORE_B64))
            $env:SM_KEYSTORE = "$env:RUNNER_TEMP/release.keystore"
          }
          python android/build.py
      - run: pyinstaller packaging/samantha.spec --noconfirm --distpath dist --workpath build
        if: steps.key.outputs.build == 'true'
      - name: Package
        if: steps.key.outputs.build == 'true'
        shell: pwsh
        run: |
          Copy-Item packaging/README-FIRST.txt dist/SamanthaScreenMirror/
          # the Android app is also its own download: the QR code in the Samantha window points at it
          Copy-Item samantha_mirror/phone_app/SamanthaPhone.apk SamanthaPhone.apk
          Copy-Item samantha_mirror/phone_app/SamanthaSetup.apk SamanthaSetup.apk
          Compress-Archive -Path dist/SamanthaScreenMirror -DestinationPath SamanthaScreenMirror-windows.zip
          # `samantha-mirror update` verifies this before installing the download
          $hash = (Get-FileHash SamanthaScreenMirror-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  SamanthaScreenMirror-windows.zip" | Set-Content -Encoding ascii SamanthaScreenMirror-windows.zip.sha256
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.build == 'true'
        with:
          name: SamanthaScreenMirror-windows
          path: |
            SamanthaScreenMirror-windows.zip
            SamanthaScreenMirror-windows.zip.sha256
            SamanthaPhone.apk
            SamanthaSetup.apk
      - uses: softprops/action-gh-release@v2
        if: steps.key.outputs.build == 'true' && startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            SamanthaScreenMirror-windows.zip
            SamanthaScreenMirror-windows.zip.sha256
            SamanthaPhone.apk
            SamanthaSetup.apk
          generate_release_notes: true
